<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>拾页 · Liquid Glass Reader</title>
<link rel="stylesheet" href="lg/tokens.css"/>
<link rel="stylesheet" href="lg/liquid-glass.css"/>
<style>
html,body{width:390px;height:844px;margin:0;overflow:hidden;font-family:"Noto Sans CJK SC","PingFang SC",-apple-system,sans-serif;color:#0F1522;-webkit-font-smoothing:antialiased}
.wallpaper{position:fixed;inset:-10%;z-index:0;background:
  radial-gradient(50% 55% at 85% 10%, #9EC5FF 0%, rgba(158,197,255,0) 60%),
  radial-gradient(45% 50% at 10% 70%, #D4C4FF 0%, rgba(212,196,255,0) 58%),
  radial-gradient(40% 45% at 60% 90%, #FFB8D4 0%, rgba(255,184,212,0) 55%),
  linear-gradient(180deg,#EAF1FB,#C9D8F2)}
.wallpaper .bg-text{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:40px 16px;font-weight:800;letter-spacing:-.03em;line-height:.9;font-size:80px;color:rgba(255,255,255,.2);pointer-events:none}
.screen{position:relative;width:390px;height:844px;z-index:1}
.sb{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 28px 10px 32px;font-size:15px;font-weight:600;z-index:40}
.sbr{display:flex;gap:7px;align-items:center}
.gest{position:absolute;bottom:10px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#0F1522;opacity:.8;z-index:50}
.paper{position:absolute;top:58px;left:14px;right:14px;bottom:96px;border-radius:28px;background:rgba(255,255,255,.88);box-shadow:0 24px 60px -24px rgba(20,40,90,.35);overflow:hidden;z-index:1}
.rd{padding:26px 22px 36px}
.ey{display:flex;align-items:center;gap:10px}
.badge{width:22px;height:22px;border-radius:8px;background:linear-gradient(145deg,#5B8CFF,#2F6BFF)}
.ey .lab{font-size:13px;font-weight:650;color:#2F6BFF}.ey .meta{font-size:13px;color:#8490A3}
h1{font-family:"Noto Serif CJK SC",serif;font-weight:700;font-size:32px;line-height:44px;letter-spacing:-.03em;margin:16px 0 0}
.sub{font-family:"Noto Serif CJK SC",serif;font-size:19px;line-height:28px;color:#566074;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:16px;--lg-radius:16px;font-size:12.5px;color:#4A5568;font-weight:500}
.chip b{color:#0F1522;font-weight:650}
.body{margin-top:22px;font-family:"Noto Serif CJK SC",serif;font-size:17.5px;line-height:31px;color:#243044;text-align:justify}
.body p+p{margin-top:14px}
.toptools{position:absolute;top:70px;right:26px;display:flex;gap:8px;z-index:25}
.tb{width:40px;height:40px;border-radius:20px;--lg-radius:20px;display:flex;align-items:center;justify-content:center;color:#0F1522}
.dock{position:absolute;left:20px;right:20px;bottom:28px;height:52px;border-radius:26px;--lg-radius:26px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:12px;color:#4A5568;font-weight:500;z-index:30}
.dock .t{color:#0F1522;font-weight:600;max-width:42%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dock .c{color:#2F6BFF;font-weight:700}
</style></head><body>
<div class="wallpaper"><div class="bg-text"><span>造景</span><span>的人</span></div></div>
<div class="screen">
<div class="sb"><span>9:41</span><span class="sbr">
<svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx=".8" fill="currentColor"/><rect x="5" y="5.5" width="3" height="6.5" rx=".8" fill="currentColor"/><rect x="10" y="3" width="3" height="9" rx=".8" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx=".8" fill="currentColor"/></svg>
<svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1.5 4.2a9 9 0 0114 0M4 6.9a5.6 5.6 0 019 0"/><circle cx="8.5" cy="10" r="1.2" fill="currentColor" stroke="none"/></svg>
<svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2.4" fill="currentColor"/><rect x="25" y="4.5" width="1.6" height="4" rx=".8" fill="currentColor" opacity=".45"/></svg>
</span></div><div class="gest"></div>
<div class="toptools">
  <div class="lg-glass tb" data-glass data-lg-refraction="18" data-lg-bezel="22"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M4 12h4M16 12h4M12 4v4M12 16v4"/></svg></div>
  <div class="lg-glass tb" data-glass data-lg-refraction="18" data-lg-bezel="22"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="6" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="18" r="1.2" fill="currentColor"/></svg></div>
</div>
<div class="paper"><div class="rd">
  <div class="ey"><div class="badge"></div><span class="lab">分享</span><span class="meta">·  10月31日</span></div>
  <h1>造景的人</h1>
  <div class="sub">李翰祥</div>
  <div class="chips">
    <span class="lg-glass chip" data-glass data-lg-refraction="14" data-lg-bezel="18">约 <b>18</b> 分钟</span>
    <span class="lg-glass chip" data-glass data-lg-refraction="14" data-lg-bezel="18"><b>7,496</b> 字</span>
    <span class="lg-glass chip" data-glass data-lg-refraction="14" data-lg-bezel="18"><b>10</b> 节</span>
  </div>
  <div class="body">
    <p>一九九六年十二月十七日下午，北京。李翰祥主持完剧组的工作会议，起身的时候忽然说了句「我难受」。说完就倒在了地上。</p>
    <p>那一年他六十九岁，正在为电视连续剧《火烧阿房宫》做筹备。从香港到台湾，再辗转大陆，他把大半辈子都耗在了片场。</p>
  </div>
</div></div>
<div class="lg-glass dock" data-glass data-lg-refraction="22" data-lg-bezel="26"><span class="t">造景的人 · 李翰祥</span><span class="c">0%</span><span>还剩 18 分钟</span></div>
</div>
<script src="lg/liquid-glass.js"></script>
<script>LiquidGlass.init({ refraction: 22, bezel: 26, blur: 2.5, tintHue: 215, tintAlpha: 0.07, specular: 1.1 });</script>
</body></html>
