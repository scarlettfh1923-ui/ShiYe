<!DOCTYPE html>

<link rel="stylesheet" href="lg/tokens.css"/>

<style>
html,body{width:390px;height:844px;margin:0;overflow:hidden;font-family:"Noto Sans CJK SC","PingFang SC",-apple-system,sans-serif;color:#0F1522;-webkit-font-smoothing:antialiased}
.wallpaper{position:fixed;inset:-10%;z-index:0;background:
  radial-gradient(45% 55% at 12% 18%, #7EB6FF 0%, rgba(126,182,255,0) 62%),
  radial-gradient(50% 60% at 88% 12%, #B8A0FF 0%, rgba(184,160,255,0) 60%),
  radial-gradient(55% 65% at 70% 88%, #5CC8FF 0%, rgba(92,200,255,0) 58%),
  radial-gradient(50% 55% at 18% 85%, #FF9EC8 0%, rgba(255,158,200,0) 55%),
  linear-gradient(160deg,#D8E6FA,#B9CBF0 55%,#A8BEE8)}
.wallpaper .bg-text{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 18px;font-weight:800;letter-spacing:-.03em;line-height:.9;font-size:88px;color:rgba(255,255,255,.22);user-select:none;pointer-events:none}
.wallpaper .bg-text span:nth-child(2){text-align:right;color:rgba(255,255,255,.14);font-size:72px}
.screen{position:relative;width:390px;height:844px;z-index:1}
.sb{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 28px 10px 32px;font-size:15px;font-weight:600;z-index:40}
.sbr{display:flex;gap:7px;align-items:center}
.gest{position:absolute;bottom:10px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#0F1522;opacity:.8;z-index:50}
.top{position:absolute;top:62px;left:16px;right:16px;display:flex;gap:10px;z-index:20}
.search{flex:1;height:48px;border-radius:24px;--lg-radius:24px;display:flex;align-items:center;gap:10px;padding:0 16px;color:rgba(15,21,34,.62);font-size:15px;font-weight:500}
.plus{width:48px;height:48px;border-radius:24px;--lg-radius:24px;display:flex;align-items:center;justify-content:center;color:#2F6BFF}
.sec{padding:0 22px;margin:16px 0 10px;font-size:20px;font-weight:700;letter-spacing:-.4px}
.hero{margin:0 16px;border-radius:26px;padding:14px;display:flex;gap:14px;background:rgba(255,255,255,.78);box-shadow:0 12px 36px -14px rgba(20,40,90,.28);backdrop-filter:blur(2px)}
.cv{width:78px;height:104px;border-radius:14px;flex:none;background:linear-gradient(160deg,#2A3A68,#1A2748);color:#F4E9D0;padding:10px 9px;display:flex;flex-direction:column;font-family:"Noto Serif CJK SC",serif;box-shadow:0 8px 18px -6px rgba(0,0,0,.35)}
.cv .ey{font-size:8px;letter-spacing:.08em;opacity:.7;font-family:"Noto Sans CJK SC",sans-serif;font-weight:600}
.cv .ru{height:.5px;background:currentColor;opacity:.35;margin:7px 0 8px}
.cv .ti{font-size:13px;line-height:17px;font-weight:700}
.cv .su{font-size:10px;opacity:.7;margin-top:4px;font-family:"Noto Sans CJK SC",sans-serif}
.hero h3{font-size:17px;line-height:24px;font-weight:650;margin-top:4px}
.pbar{height:3px;border-radius:2px;background:rgba(15,21,34,.1);overflow:hidden;margin-top:10px}
.pbar i{display:block;height:100%;width:38%;background:#2F6BFF;border-radius:2px}
.pmeta{font-size:12px;color:#4A5568;margin-top:8px}
.car{display:flex;gap:12px;padding:0 16px;overflow:hidden}
.car .c{width:112px;flex:none}
.car .cap{font-size:13px;line-height:18px;font-weight:600;margin-top:10px;height:36px;overflow:hidden}
.car .mt{font-size:11px;color:#6B778A;margin-top:4px}
.list{margin:14px 16px 0;border-radius:22px;overflow:hidden;background:rgba(255,255,255,.78);box-shadow:0 10px 28px -14px rgba(20,40,90,.25)}
.lrow{display:flex;gap:14px;align-items:center;padding:12px 14px}
.lrow+.lrow{border-top:.5px solid rgba(15,21,34,.08)}
.mini{width:44px;height:58px;border-radius:10px;flex:none;background:linear-gradient(160deg,#3D5A9A,#243968)}
.lrow .tt{font-size:15px;font-weight:600}.lrow .mt{font-size:12px;color:#6B778A;margin-top:3px}
.nav{position:absolute;left:18px;right:18px;bottom:28px;height:64px;border-radius:32px;--lg-radius:32px;display:flex;align-items:center;padding:0 8px;z-index:30}
.nav .n{flex:1;height:48px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:500;color:rgba(15,21,34,.65)}
.nav .n.on{background:rgba(47,107,255,.18);color:#2F6BFF;font-weight:700}
</style></head><body>
