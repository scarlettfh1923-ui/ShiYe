<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>拾页 · Liquid Glass Settings</title>
<link rel="stylesheet" href="lg/tokens.css"/>
<link rel="stylesheet" href="lg/liquid-glass.css"/>
<style>
html,body{width:390px;height:844px;margin:0;overflow:hidden;font-family:"Noto Sans CJK SC","PingFang SC",-apple-system,sans-serif;color:#0F1522;-webkit-font-smoothing:antialiased}
.wallpaper{position:fixed;inset:-10%;z-index:0;background:
  radial-gradient(48% 55% at 15% 20%, #8EC5FF 0%, rgba(142,197,255,0) 60%),
  radial-gradient(50% 55% at 90% 30%, #C4B5FD 0%, rgba(196,181,253,0) 58%),
  radial-gradient(45% 50% at 50% 95%, #67E8F9 0%, rgba(103,232,249,0) 55%),
  linear-gradient(160deg,#DDE8F8,#B7CAEA)}
.wallpaper .bg-text{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 16px;font-weight:800;letter-spacing:-.03em;line-height:.9;font-size:92px;color:rgba(255,255,255,.2);pointer-events:none}
.screen{position:relative;width:390px;height:844px;z-index:1}
.sb{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 28px 10px 32px;font-size:15px;font-weight:600;z-index:40}
.sbr{display:flex;gap:7px;align-items:center}
.gest{position:absolute;bottom:10px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#0F1522;opacity:.8;z-index:50}
.head{position:absolute;top:66px;left:24px;font-size:28px;font-weight:750;letter-spacing:-.5px}
.groups{position:absolute;top:118px;left:16px;right:16px;bottom:110px;overflow:hidden}
.g{border-radius:24px;--lg-radius:24px;margin-bottom:14px;overflow:hidden}
.g .h{padding:12px 16px 4px;font-size:12px;font-weight:600;color:rgba(15,21,34,.5);letter-spacing:.04em}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px}
.row+.row{border-top:.5px solid rgba(15,21,34,.1)}
.ic{width:30px;height:30px;border-radius:9px;background:rgba(47,107,255,.16);color:#2F6BFF;display:flex;align-items:center;justify-content:center;flex:none}
.tt{font-size:15px;font-weight:600}.mt{font-size:12px;color:#6B778A;margin-top:2px}
.chev{margin-left:auto;color:#8490A3}
.nav{position:absolute;left:18px;right:18px;bottom:28px;height:64px;border-radius:32px;--lg-radius:32px;display:flex;align-items:center;padding:0 8px;z-index:30}
.nav .n{flex:1;height:48px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:500;color:rgba(15,21,34,.65)}
.nav .n.on{background:rgba(47,107,255,.18);color:#2F6BFF;font-weight:700}
</style></head><body>
<div class="wallpaper"><div class="bg-text"><span>我的</span><span>拾页</span></div></div>
<div class="screen">
<div class="sb"><span>9:41</span><span class="sbr">
<svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx=".8" fill="currentColor"/><rect x="5" y="5.5" width="3" height="6.5" rx=".8" fill="currentColor"/><rect x="10" y="3" width="3" height="9" rx=".8" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx=".8" fill="currentColor"/></svg>
<svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1.5 4.2a9 9 0 0114 0M4 6.9a5.6 5.6 0 019 0"/><circle cx="8.5" cy="10" r="1.2" fill="currentColor" stroke="none"/></svg>
<svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2.4" fill="currentColor"/><rect x="25" y="4.5" width="1.6" height="4" rx=".8" fill="currentColor" opacity=".45"/></svg>
</span></div><div class="gest"></div>
<div class="head">我的</div>
<div class="groups">
  <div class="lg-glass g" data-glass data-lg-refraction="18" data-lg-bezel="22">
    <div class="h">外观与同步</div>
    <div class="row"><div class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h16M4 12h10M4 17h13"/></svg></div><div><div class="tt">阅读样式</div><div class="mt">字体、字号、行距、段间距、主题</div></div><span class="chev">›</span></div>
    <div class="row"><div class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6h16v12H4z"/></svg></div><div><div class="tt">Notion 同步</div><div class="mt">未配置，点这里设置</div></div><span class="chev">›</span></div>
  </div>
  <div class="lg-glass g" data-glass data-lg-refraction="18" data-lg-bezel="22">
    <div class="h">阅读与安全</div>
    <div class="row"><div class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l8 4v5c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V7l8-4z"/></svg></div><div><div class="tt">网页脚本默认关闭</div><div class="mt">需要时在网页阅读页单独开启</div></div></div>
  </div>
  <div class="lg-glass g" data-glass data-lg-refraction="18" data-lg-bezel="22">
    <div class="h">书库</div>
    <div class="row"><div class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h16M9 7V5h6v2M6 7l1 12h10l1-12"/></svg></div><div><div class="tt">清空书库</div><div class="mt">删除拾页里的全部文档</div></div><span class="chev">›</span></div>
  </div>
</div>
<div class="lg-glass nav" data-glass data-lg-refraction="22" data-lg-bezel="26">
  <div class="n"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19V7l8-3 8 3v12"/><path d="M12 4v15"/></svg>阅读</div>
  <div class="n"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="5" width="7" height="7" rx="1.5"/><rect x="13" y="5" width="7" height="7" rx="1.5"/><rect x="4" y="14" width="7" height="5" rx="1.5"/><rect x="13" y="14" width="7" height="5" rx="1.5"/></svg>书库</div>
  <div class="n on"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="9" r="3.2"/><path d="M5.5 19a6.5 6.5 0 0113 0"/></svg>我的</div>
</div>
</div>
<script src="lg/liquid-glass.js"></script>
<script>LiquidGlass.init({ refraction: 22, bezel: 26, blur: 2.5, tintHue: 220, tintAlpha: 0.08, specular: 1.05 });</script>
</body></html>
