<!doctype html><html><head><meta charset="utf-8"><style>
:root{
  --bg:#F5F7FA; --paper:#FAFBFD; --acc:#2F6BFF; --acc-s:rgba(47,107,255,.10);
  --t1:#1A2233; --t2:#5B6578; --t3:#8B94A6; --hair:rgba(26,34,51,.08);
  --soft:#EEF2FF;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--t1);
 -webkit-font-smoothing:antialiased;font-family:"Noto Sans CJK SC","PingFang SC",system-ui,sans-serif}
.serif{font-family:"Noto Serif CJK SC","Songti SC","STSong",serif}
.screen{position:relative;width:390px;height:844px;background:var(--paper);overflow:hidden}
.sb{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:flex-end;
 padding:0 28px 10px 32px;font-size:15px;font-weight:600;letter-spacing:-.2px;z-index:20;color:var(--t1)}
.sbr{display:flex;gap:7px;align-items:center}
.gest{position:absolute;bottom:10px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--t1);opacity:.88;z-index:30}

/* content */
.rd{position:absolute;top:72px;left:0;right:0;bottom:0;padding:0 28px;overflow:hidden}
.ey{display:flex;align-items:center;gap:10px}
.badge{width:22px;height:22px;border-radius:8px;background:linear-gradient(145deg,#5B8CFF,#2F6BFF);
 box-shadow:0 2px 6px rgba(47,107,255,.28);display:flex;align-items:center;justify-content:center;position:relative}
.badge svg{display:block}
.ey .lab{font-size:13px;line-height:18px;font-weight:650;color:var(--acc);letter-spacing:.04em}
.ey .meta{font-size:13px;line-height:18px;color:var(--t3);font-weight:500;letter-spacing:.01em}

h1{font-family:"Noto Serif CJK SC","Songti SC",serif;font-weight:700;font-size:34px;line-height:46px;
 letter-spacing:-.03em;margin-top:18px;color:var(--t1)}
.sub{font-family:"Noto Serif CJK SC","Songti SC",serif;font-weight:400;font-size:20px;line-height:28px;
 letter-spacing:-.01em;color:var(--t2);margin-top:6px}

/* cute soft meta chips — no dek */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 10px;border-radius:15px;
 background:var(--soft);color:var(--t2);font-size:12.5px;line-height:16px;font-weight:500}
.chip b{color:var(--t1);font-weight:650}
.chip svg{flex:none;opacity:.85}

.body{margin-top:26px;font-family:"Noto Serif CJK SC","Songti SC",serif;font-size:17.5px;line-height:31px;
 color:#243044;text-align:justify;letter-spacing:.015em}
.body p+p{margin-top:14px}

/* bottom progress glass */
.dock{position:absolute;left:16px;right:16px;bottom:28px;height:44px;border-radius:22px;
 background:rgba(255,255,255,.72);backdrop-filter:blur(24px) saturate(1.6);
 border:.5px solid rgba(255,255,255,.95);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 8px 28px -8px rgba(31,50,100,.18);
 display:flex;align-items:center;justify-content:space-between;padding:0 16px;
 font-size:12px;color:var(--t2);font-weight:500;z-index:15}
.dock .t{color:var(--t1);font-weight:600;max-width:42%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dock .c{color:var(--acc);font-weight:650}
</style></head><body><div class="screen">
<div class="sb"><span>9:41</span><span class="sbr">
<svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx=".8" fill="currentColor"/><rect x="5" y="5.5" width="3" height="6.5" rx=".8" fill="currentColor"/><rect x="10" y="3" width="3" height="9" rx=".8" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx=".8" fill="currentColor"/></svg>
<svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 4.2a9 9 0 0114 0M4 6.9a5.6 5.6 0 019 0"/><circle cx="8.5" cy="10" r="1.2" fill="currentColor" stroke="none"/></svg>
<svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2.4" fill="currentColor"/><rect x="25" y="4.5" width="1.6" height="4" rx=".8" fill="currentColor" opacity=".45"/></svg>
</span></div>
<div class="gest"></div>

<div class="rd">
  <div class="ey">
    <div class="badge" title="来源">
      <!-- tiny folded page / cute leaf -->
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v12a1 1 0 01-1 1H7a1 1 0 01-1-1V4a1 1 0 011-1z"/><path d="M14 3v5h5"/></svg>
    </div>
    <span class="lab">分享</span>
    <span class="meta">·  10月31日</span>
  </div>

  <h1>造景的人</h1>
  <div class="sub">李翰祥</div>

  <!-- 无简介：直接软胶囊信息 -->
  <div class="chips">
    <span class="chip">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      约 <b>18</b> 分钟
    </span>
    <span class="chip">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M7 3h7l5 5v12a1 1 0 01-1 1H7a1 1 0 01-1-1V4a1 1 0 011-1z"/><path d="M14 3v5h5"/></svg>
      <b>7,496</b> 字
    </span>
    <span class="chip">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.8" cy="6" r="1"/><circle cx="4.8" cy="12" r="1"/><circle cx="4.8" cy="18" r="1"/></svg>
      <b>10</b> 节
    </span>
  </div>

  <div class="body">
    <p>一九九六年十二月十七日下午，北京。李翰祥主持完剧组的工作会议，起身的时候忽然说了句「我难受」。说完就倒在了地上。</p>
    <p>那一年他六十九岁，正在为电视连续剧《火烧阿房宫》做筹备。从香港到台湾，再辗转大陆，他把大半辈子都耗在了片场。</p>
  </div>
</div>

<div class="dock">
  <span class="t">造景的人 · 李翰祥</span>
  <span class="c">0%</span>
  <span>还剩 18 分钟</span>
</div>
</div></body></html>
