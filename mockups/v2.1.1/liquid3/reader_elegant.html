  <div class="chips">

  <div class="body">
    <p>一九九六年十二月十七日下午，北京。李翰祥主持完剧组的工作会议，起身的时候忽然说了句「我难受」。说完就倒在了地上。</p>
    <p>那一年他六十九岁，正在为电视连续剧《火烧阿房宫》做筹备。从香港到台湾，再辗转大陆，他把大半辈子都耗在了片场，也把中国电影史上最铺张的布景，一座一座造了出来。</p>
